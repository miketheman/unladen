name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Only 3.14 gates merges. The free-threaded and pre-release
    # builds are informational, so a missing wheel or a CPython
    # alpha bug cannot block an unrelated PR.
    continue-on-error: ${{ matrix.python-version != '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: false

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Run type checker
        run: uv run ty check

      - name: Run tests with coverage
        run: uv run pytest --cov=unladen --cov-report=term-missing
