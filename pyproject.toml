[project]
name = "unladen"
version = "0.1.0"
description = "Measure the logical heft of your Python dependencies"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["dependencies", "static-analysis", "ast", "lloc", "heft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "rich",
]

[[project.authors]]
name = "Mike Fiedler"
email = "miketheman@gmail.com"

[project.urls]
Homepage = "https://github.com/miketheman/unladen"
Repository = "https://github.com/miketheman/unladen"
Issues = "https://github.com/miketheman/unladen/issues"

[project.scripts]
unladen = "unladen.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-socket",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.7.2,<0.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--disable-socket",
]

[tool.coverage.run]
source = ["unladen"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ty.environment]
root = ["src"]

[tool.ty.src]
exclude = ["tests/fixtures/"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
